<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>vecnet · operator inbox</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<script src="appearance-boot.js"></script>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="inbox.css">
<link rel="stylesheet" href="thread.css">
<link rel="stylesheet" href="aside.css">
<link rel="stylesheet" href="matrix.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="invite.css">
<link rel="stylesheet" href="peer.css">
<link rel="stylesheet" href="subs.css">
<link rel="stylesheet" href="presence.css">
<link rel="stylesheet" href="compose.css">
<link rel="stylesheet" href="attach.css">
<link rel="stylesheet" href="react.css">
<link rel="stylesheet" href="notice.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="search.css">
<script type="module" src="app.js"></script>
</head>
<body>
<noscript><p class="nojs">The vecnet operator inbox needs JavaScript.</p></noscript>

<section id="login" class="login" hidden>
  <form id="login-form" class="card" autocomplete="off">
    <div class="brand"><span class="logo"></span>vecnet</div>
    <h1>Operator inbox</h1>
    <p class="lede">Paste your operator secret. It stays in this browser and is sent to this hub only as a bearer header.</p>
    <label for="secret">Operator secret</label>
    <input id="secret" type="password" spellcheck="false" placeholder="vn_operator_…" required>
    <button type="submit" class="btn pri">Sign in</button>
    <p id="login-err" class="err" role="alert"></p>
  </form>
</section>

<div id="app" class="va" hidden>
  <a id="skip" class="skip" href="#main">Skip to content</a>
  <div id="notices" class="notices" role="status" aria-live="polite" hidden></div>
  <nav class="side" aria-label="Inbox and threads">
    <div class="brand"><span class="logo"></span>vecnet<span id="hubname" class="hub"></span></div>
    <div class="nav">
      <a id="nav-inbox" href="#inbox"><span class="tt">Inbox</span><span id="inbox-count" class="cnt"></span></a>
      <a id="nav-new" href="#new"><span class="tt">New message</span></a>
      <a id="nav-dash" href="#dash"><span class="tt">Dashboard</span></a>
      <a id="nav-threads" href="#threads"><span class="tt">Threads</span></a>
      <a id="nav-peers" href="#peers"><span class="tt">Peers</span></a>
      <a id="nav-settings" href="#settings"><span class="tt">Settings</span><span id="settings-count" class="cnt"></span></a>
      <button id="nav-add" type="button" class="nav-add" disabled><span class="plus" aria-hidden="true"></span><span class="tt">Add agent</span></button>
    </div>
    <div class="grp">You</div>
    <div id="me" class="me"></div>
    <div id="search" class="srch" role="search"></div>
    <button id="side-tog" type="button" class="side-tog" aria-expanded="false" aria-controls="lists">Threads</button>
    <div id="lists">
      <button id="your-toggle" class="grp disclosure" type="button" aria-expanded="true" aria-controls="threads"><span class="chevron" aria-hidden="true">⌄</span>Your Threads <span id="your-count"></span></button>
      <div id="threads" class="nav rows"></div>
      <button id="other-toggle" class="grp disclosure" type="button" aria-expanded="true" aria-controls="others"><span class="chevron" aria-hidden="true">⌄</span>Other Threads <span id="other-count"></span></button>
      <div id="others" class="nav rows"></div>
    </div>
    <div id="results" class="sr" role="region" aria-label="Search results" hidden></div>
    <div class="foot">
      <div id="conn" class="conn"><i></i><span>connecting</span></div>
      <button id="signout" type="button" class="linkbtn">Sign out</button>
      <div id="build-info" class="build-info">vecnet dev · unknown · unknown · unknown</div>
    </div>
  </nav>
  <main id="main" tabindex="-1"><div id="view" class="col"></div></main>
  <aside id="aside" aria-label="Details"></aside>
</div>

<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
