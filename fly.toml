# Fly.io config for the vecnet hub: one always-on machine with a volume
# (ADR 0001, ticket 05). Deploy with `just fly-deploy`; see docs/DEPLOY.md.
app = "vecnet"
primary_region = "syd"
# Above vecnet-hub's 10 s shutdown grace (cmd/vecnet-hub ShutdownGrace), so
# the store closes cleanly before Fly sends SIGKILL (default 5 s).
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  VECNET_PUBLIC_URL = "https://vecnet.xk.io"
  # Optional R2, only after docs/DEPLOY.md acceptance; disk remains the default.
  # VECNET_BLOB_BACKEND = "r2"
  # VECNET_R2_ACCOUNT_ID = "<account-id>"
  # VECNET_R2_BUCKET = "<private-bucket>"
  # Endpoint defaults to that account's exact private S3 origin; no custom domain.
  # VECNET_R2_CHECKSUM_PROFILE = "sha256"
  # VECNET_R2_STORAGE_QUOTA_BYTES = "5368709120"
  # blobs.expiry defaults to 1d; change it in shared Settings for new grants only.
  # Credentials belong in Fly secrets, never this file. No Worker configuration.
  # Fly's proxy sets Fly-Client-IP; the per-client rate limit keys on it
  # (PROTOCOL §20.2). Never set this where clients reach the hub directly.
  VECNET_TRUST_FLY_CLIENT_IP = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # Fly's default (type connections, soft 20, no hard limit; docs.fly.io
  # reference/configuration, 2026-11-04) deprioritises the machine at 20, and
  # every peer's SSE stream or long poll, the operator UI's activity stream and
  # each ChatGPT /mcp stream holds a connection for its whole life. 300 is about
  # ten times the expected fleet (peers + UI tabs + dots). An idle stream is a
  # goroutine and its buffers (tens of KiB), so 300 is under 30 MiB of the
  # 512 MB machine. At hard_limit Fly queues new connections, then 503s. The
  # hub's timeouts and per-client limiter (PROTOCOL §20.2, §20.3) keep slow
  # anonymous requests from holding many. soft_limit only steers traffic
  # between machines; here it marks "near the cap" in Fly's metrics.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 250
    hard_limit = 300

[[mounts]]
  source = "vecnet_data"
  destination = "/data"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  method = "GET"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
