name: R18 native discovery comparison
on:
  push:
    branches: [ci80/r18-discovery-probe]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, arch: x64, width: '2'}
          - {runner: windows-2025, arch: x64, width: '4'}
          - {runner: windows-11-arm, arch: arm64, width: '2'}
          - {runner: windows-11-arm, arch: arm64, width: '4'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      GOMAXPROCS: '1'
      WIDTH: ${{ matrix.width }}
      BUNDLE_SHA: 401a8214e2484846854727bf0e8897cc46257362
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        timeout-minutes: 1
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        timeout-minutes: 1
        with:
          name: go-tests-win32-${{ matrix.arch }}
          path: dist/go-tests
          run-id: 44305065506
          github-token: ${{ github.token }}
      - name: Compare cold native discovery at the selected width
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/probe-r18-discovery.mjs
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: discovery-${{ matrix.arch }}-${{ matrix.width }}
          path: discovery-result.json
          if-no-files-found: error
