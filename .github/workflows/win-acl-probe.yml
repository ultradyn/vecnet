name: Disposable Windows Node shard diagnostic
on:
  push:
    branches: [ci80/r14-node-probe]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      CI_GO_COMPILE_JOBS: '4'
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        timeout-minutes: 1
        with:
          node-version: '24'
      - name: Download pinned Go
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/toolchain.mjs download
      - name: Extract pinned Go
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/toolchain.mjs extract
      - name: Cold dependencies 0
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 0
      - name: Cold dependencies 1
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 1
      - name: Cold dependencies 2
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 2
      - name: Cold dependencies 3
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 3
      - name: Build exact-source native product targets
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/npm/target.mjs win32-${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: node-native-${{ matrix.arch }}
          path: dist/targets
          if-no-files-found: error
  native:
    needs: compile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      VECNET_BIN: ${{ github.workspace }}/bin/vecnet.exe
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          persist-credentials: false
          sparse-checkout: |
            internal
            connectors
            scripts
            docs/protocol
            npm
      - uses: actions/setup-node@v6
        timeout-minutes: 1
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        timeout-minutes: 1
        with:
          name: node-native-${{ matrix.arch }}
          path: dist/targets
      - name: Verify and install same-source native targets
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/native.mjs
      - name: Whole original Windows platform assertions on x64
        if: matrix.arch == 'amd64'
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/diagnostic-node-shard.mjs whole
      - name: Original Windows platform assertions shard 0 of 4
        if: always()
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/diagnostic-node-shard.mjs 0
      - name: Original Windows platform assertions shard 1 of 4
        if: always()
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/diagnostic-node-shard.mjs 1
      - name: Original Windows platform assertions shard 2 of 4
        if: always()
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/diagnostic-node-shard.mjs 2
      - name: Original Windows platform assertions shard 3 of 4
        if: always()
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/diagnostic-node-shard.mjs 3
