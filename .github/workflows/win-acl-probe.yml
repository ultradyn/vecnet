name: Disposable Windows recovery probe
on:
  push:
    branches: [ci80/win-acl-probe]
permissions:
  contents: read
  actions: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - run: git config --global core.autocrlf false
        timeout-minutes: 1
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        timeout-minutes: 1
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        timeout-minutes: 1
        with:
          github-token: ${{ github.token }}
          run-id: 44240225126
          name: native-win32-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          path: dist/targets
      - name: Verify saved native binaries and bind fixture helper
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/probe-artifact.mjs
      - name: Verify private recovery creation and retained SQLite state
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node --disable-warning=ExperimentalWarning --test --test-concurrency=1 --test-name-pattern='Windows recovery precreates' connectors/launcher/test/windows-platform.test.ts
      - name: Verify native helper loss and live replacement
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node --disable-warning=ExperimentalWarning --test --test-concurrency=1 --test-name-pattern='Windows live connector exposes' connectors/launcher/test/windows-platform.test.ts
      - name: Verify standalone and embedded lifecycle cleanup
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node --disable-warning=ExperimentalWarning --test --test-concurrency=1 --test-name-pattern='Windows standalone|Windows embedded' connectors/launcher/test/windows-platform.test.ts
