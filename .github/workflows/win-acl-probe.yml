name: Disposable Windows runtime probe
on:
  push:
    branches: [ci80/r8-focused-probe]
permissions:
  contents: read
concurrency:
  group: ci80-r8-focused-probe
  cancel-in-progress: true
env:
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'
jobs:
  focused:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve LF
        timeout-minutes: 1
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        timeout-minutes: 1
        with:
          node-version: '24'
      - name: Download verified Go
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/toolchain.mjs download
      - name: Extract Go
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/toolchain.mjs extract
      - name: Cold dependencies 1
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 0
      - name: Cold dependencies 2
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 1
      - name: Cold dependencies 3
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 2
      - name: Cold dependencies 4
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node scripts/ci/suite.mjs prepare-go 3
      - name: Node sharding regressions
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 node --test scripts/ci/node-schedule.test.mjs
      - name: Concurrent Windows runtime and activation guards
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 go test -p 2 -count=1 -timeout=50s -json ./internal/localruntime
      - name: Real reader checkpoint pressure
        timeout-minutes: 1
        run: node scripts/ci/budget.mjs 53000 go test -p 2 -count=1 -timeout=50s -json ./internal/hub -run '^TestBackfillRealReaderCheckpointPressure$'
