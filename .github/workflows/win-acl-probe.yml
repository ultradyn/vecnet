name: Disposable runner capacity probe
on:
  push:
    branches: [ci80/r8-focused-probe]
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Report actual allocated CPU and memory
        timeout-minutes: 1
        run: node -e "const os=require('node:os'); console.log(JSON.stringify({availableParallelism:os.availableParallelism(),cpus:os.cpus().length,totalMemoryBytes:os.totalmem(),platform:process.platform,arch:process.arch,node:process.version}));"
