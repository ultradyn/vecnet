name: Evidence guard

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check introduced evidence history against the event base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          # The empty-tree sentinel checks all reachable commits on initial pushes.
          if [[ "$base" =~ ^0{40}$ ]]; then
            base=$(git hash-object -t tree --stdin </dev/null)
          fi
          node scripts/evidence/check.mjs --base "$base"
