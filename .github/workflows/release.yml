name: Release

on:
  push:
    tags: ['v*']
    branches: [master]
  pull_request:
  # Builds and tests only; publishing always requires a pushed version tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      npm-tag: ${{ steps.package.outputs.npm-tag }}
      tarball: ${{ steps.package.outputs.tarball }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve package version
        id: package
        run: node scripts/npm/release.mjs info
      - name: Verify tag matches a version on master
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/npm/release.mjs check-tag "$GITHUB_REF_NAME"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Pin npm for repeatable packaging and OIDC support
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - name: Test release guards and cross-platform wrappers
        run: node --test --test-concurrency=2 scripts/npm/release.test.mjs scripts/npm/npm-command.test.mjs scripts/npm/wrapper.test.mjs scripts/npm/verify-artifact.test.mjs
      - name: Test Go packages
        run: go test -mod=readonly -p 2 -timeout=20m ./...
      - name: Build native binaries for connector tests
        run: go build -mod=readonly -p 2 -o bin/ ./cmd/vecnet ./cmd/vecnet-hub
      - name: Test Node connectors
        env:
          VECNET_BIN: ${{ github.workspace }}/bin/vecnet
        run: node --disable-warning=ExperimentalWarning --test --test-concurrency=2 "connectors/hub-client/test/*.test.ts" "connectors/launcher/test/*.test.ts" "connectors/launcher/test/backends/*.test.ts"
      - name: Test Node connectors against a real hub
        run: node --disable-warning=ExperimentalWarning --test --test-concurrency=1 "connectors/launcher/test/e2e/*.test.ts"
      - name: Build and pack Linux and Windows on x64 and ARM64
        run: |
          node scripts/npm/build.mjs
          npm pack ./dist/npm --pack-destination ./dist
      - name: Test the packed package on x64
        run: node --test --test-concurrency=2 scripts/npm/package.test.mjs
      - name: Record release checksum
        working-directory: dist
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: sha256sum "$TARBALL" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  test-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: npm-release
          path: dist
      - name: Verify the artifact checksum
        run: node scripts/npm/verify-artifact.mjs
      - name: Test the same packed package on native ARM64
        run: node --test --test-concurrency=2 scripts/npm/package.test.mjs

  test-windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Preserve LF asset bytes for packed-source verification
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Pin npm to the packaging version
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - name: Test release guards and cross-platform wrappers
        run: node --test --test-concurrency=2 scripts/npm/release.test.mjs scripts/npm/npm-command.test.mjs scripts/npm/wrapper.test.mjs scripts/npm/verify-artifact.test.mjs
      - name: Test read-only Windows artifact evidence helper
        run: .\scripts\windows\Get-ArtifactEvidence.Tests.ps1
      - name: Test the full Go suite on Windows
        run: go test -mod=readonly -p 2 -timeout=40m -json ./...
      - name: Build native binaries for connector tests
        run: go build -mod=readonly -p 2 -o bin/ ./cmd/vecnet ./cmd/vecnet-hub
      - name: Test Node connectors on Windows
        env:
          VECNET_BIN: ${{ github.workspace }}/bin/vecnet.exe
        run: node --disable-warning=ExperimentalWarning --test --test-concurrency=2 "connectors/hub-client/test/*.test.ts" "connectors/launcher/test/*.test.ts" "connectors/launcher/test/backends/*.test.ts"
      - name: Test Node connectors against a real hub on Windows
        env:
          VECNET_BIN: ${{ github.workspace }}/bin/vecnet.exe
        run: node --disable-warning=ExperimentalWarning --test --test-concurrency=1 "connectors/launcher/test/e2e/*.test.ts"
      - uses: actions/download-artifact@v5
        with:
          name: npm-release
          path: dist
      - name: Verify the identical packed artifact checksum
        run: node scripts/npm/verify-artifact.mjs
      - name: Test the same packed package on native Windows
        run: node --test --test-concurrency=2 scripts/npm/package.test.mjs

  publish:
    needs: [build, test-arm64, test-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up npm trusted publishing
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v5
        with:
          name: npm-release
          path: dist
      - name: Verify the tested artifact checksum
        run: node scripts/npm/verify-artifact.mjs
      - name: Publish the tested tarball through OIDC
        env:
          # npm provenance requires a public source repository.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: node scripts/npm/release.mjs publish
      - name: Create or finish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$TARBALL" dist/SHA256SUMS --clobber
          else
            flags=()
            if [ "$NPM_TAG" = next ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "dist/$TARBALL" dist/SHA256SUMS \
              --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
