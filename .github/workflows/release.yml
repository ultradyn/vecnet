name: Release

on:
  push:
    tags: ['v*']
  # Builds and tests only; publishing always requires a pushed version tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      npm-tag: ${{ steps.package.outputs.npm-tag }}
      tarball: ${{ steps.package.outputs.tarball }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve package version
        id: package
        run: node scripts/npm/release.mjs info
      - name: Verify tag matches a version on master
        if: github.event_name == 'push'
        run: node scripts/npm/release.mjs check-tag "$GITHUB_REF_NAME"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - name: Pin npm for repeatable packaging and OIDC support
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - name: Test release guards
        run: node --test --test-concurrency=2 scripts/npm/release.test.mjs
      - name: Test Go packages
        run: go test -mod=readonly -p 2 -timeout=20m ./...
      - name: Build and pack both Linux architectures
        run: |
          node scripts/npm/build.mjs
          npm pack ./dist/npm --pack-destination ./dist
      - name: Test the packed package on x64
        run: node --test --test-concurrency=2 scripts/npm/package.test.mjs
      - name: Record release checksum
        working-directory: dist
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: sha256sum "$TARBALL" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  test-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: npm-release
          path: dist
      - name: Verify the artifact checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Test the same packed package on native ARM64
        run: node --test --test-concurrency=2 scripts/npm/package.test.mjs

  publish:
    needs: [build, test-arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up npm trusted publishing
        run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v5
        with:
          name: npm-release
          path: dist
      - name: Verify the tested artifact checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested tarball through OIDC
        env:
          # npm provenance requires a public source repository.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: node scripts/npm/release.mjs publish
      - name: Create or finish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$TARBALL" dist/SHA256SUMS --clobber
          else
            flags=()
            if [ "$NPM_TAG" = next ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "dist/$TARBALL" dist/SHA256SUMS \
              --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
