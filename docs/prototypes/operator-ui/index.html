<!DOCTYPE html>
<!--
  PROTOTYPE (throwaway, ticket 18). Three radically different variants of the vecnet
  operator UI (inbox, chat, dashboard), switchable via ?variant=a|b|c and the floating
  bottom bar. Mock data lives in memory and is derived from docs/protocol/examples/.
  No build, no persistence. Reload resets everything.
  URL params: variant=a|b|c  tab=inbox|chat|dash  thread=T1..T6
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE: vecnet operator UI (ticket 18)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19;--panel:#10162a;--panel2:#151c33;--line:#222b45;--line2:#2c3756;
  --text:#f3f4f6;--muted:#9aa4b8;--dim:#5f6a84;
  --grad:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);
  --wake:#fbbf24;--widle:#38bdf8;--hold:#8391ad;--ok:#34d399;--bad:#fb7185;--violet:#a5b4fc;
  --sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #a855f7;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#hazard{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:repeating-linear-gradient(135deg,#fbbf24 0 10px,#0b0f19 10px 20px)}
.mono{font-family:var(--mono)}
/* shared chips */
.prio{font:500 10.5px/1 var(--mono);padding:3px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.prio.wake{color:var(--wake);border-color:#fbbf2450;background:#fbbf2412}
.prio.wake_idle{color:var(--widle);border-color:#38bdf850;background:#38bdf812}
.prio.hold{color:var(--hold);border-color:#8391ad50;background:#8391ad12}
.att{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:4px 8px;border-radius:6px;border:1px solid var(--line2);background:#0d1325;color:#cbd5e1;text-decoration:none}
.att .sz{color:var(--dim)}
.att.spill{border-style:dashed;border-color:#a855f780}
.att svg{flex:none}
.st-queued{--c:#64748b}.st-pushed{--c:#38bdf8}.st-accepted{--c:#818cf8}.st-processed{--c:#34d399}.st-read{--c:#e2e8f0}
.st-failed,.st-dead_letter{--c:#fb7185}.st-expired{--c:#a1a1aa}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:70;background:#1e2640;border:1px solid var(--line2);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;transition:transform .25s ease;box-shadow:0 10px 30px #0008}
#toast.on{transform:translateX(-50%) translateY(0)}
/* floating prototype bar: deliberately NOT part of any design */
#proto{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;background:#f3f4f6;color:#0b0f19;border-radius:999px;padding:5px 8px 5px 5px;font:500 12.5px var(--sans);box-shadow:0 12px 40px #000c,0 0 0 1px #0004;white-space:nowrap}
#proto .tag{font:700 11px var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:999px;background:repeating-linear-gradient(135deg,#fbbf24 0 8px,#f59e0b 8px 16px);color:#111827}
#proto button{border:0;background:#0b0f19;color:#f3f4f6;border-radius:999px;width:28px;height:28px;font-size:15px;line-height:1}
#proto button.txt{width:auto;padding:0 10px;font-size:12px}
#proto .lbl{min-width:190px;text-align:center;font-weight:600}
#proto .sep{width:1px;height:20px;background:#0b0f1930}
#proto .credit{color:#374151;font-size:11.5px}
#proto .credit a{color:#4f46e5;font-weight:600}
#proto .clk{font:600 12px var(--mono)}

/* ===================== VARIANT A: modest, Cursor-like ===================== */
.va{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;height:100vh}
.va .side{border-right:1px solid var(--line);padding:20px 10px 90px;overflow:auto;background:#0c1120}
.va .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;padding:2px 8px 18px}
.va .logo{width:18px;height:18px;border-radius:5px;background:var(--grad)}
.va .brand .hub{margin-left:auto;font:400 11px var(--mono);color:var(--dim)}
.va .nav a{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 9px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13.5px;cursor:pointer}
.va .nav a:hover{background:#141a2e;color:var(--text)}
.va .nav a.on{background:#1a2139;color:var(--text)}
.va .nav .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.va .nav .cnt{font:500 11px var(--mono);color:var(--dim);flex:none}
.va .nav .cnt.hot{color:#0b0f19;background:var(--wake);border-radius:9px;padding:1px 6px}
.va .grp{font-size:12px;color:var(--dim);padding:20px 9px 6px}
.va .me{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:13px;color:var(--muted)}
.va main{overflow:auto;padding:40px 48px 110px}
.va .col{max-width:740px;margin:0 auto}
.va h1{font-size:23px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
.va .lede{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 8px;max-width:64ch}
.va h2{font-size:14.5px;font-weight:600;margin:36px 0 12px;display:flex;gap:8px;align-items:baseline}
.va h2 .n{color:var(--dim);font-weight:400;font-size:13px}
.va .item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#0e1426}
.va .item.done{opacity:.5}
.va .item .who{font-size:13.5px;font-weight:600}
.va .item .meta{font-size:12px;color:var(--dim);margin-top:2px}
.va .item .ex{font-size:13.5px;color:#cbd5e1;line-height:1.55;margin-top:6px}
.va .item .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.va .av{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:600 12.5px var(--sans);color:#0b0f19;background:var(--k)}
.va .apr{border:1px solid transparent;background:linear-gradient(#0e1426,#0e1426) padding-box,var(--grad) border-box}
.va .q{font-size:15px;font-weight:600;margin:6px 0 10px;line-height:1.45}
.va .opts{display:flex;gap:8px;flex-wrap:wrap}
.va .btn{border:1px solid var(--line2);background:#151c33;border-radius:7px;padding:6px 12px;font-size:13px}
.va .btn:hover{border-color:#6366f1}
.va .btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.va .btn.ghost{background:none}
.va .exp{font:500 12px var(--mono);color:var(--wake)}
.va .muted{color:var(--muted)}
.va .dl{border-color:#fb718540}
.va .dl .code{font:500 12px var(--mono);color:var(--bad)}
.va .resolved{font-size:12.5px;color:var(--ok)}
.va aside{border-left:1px solid var(--line);padding:40px 22px 110px;overflow:auto;font-size:13px;color:var(--muted);line-height:1.6}
.va aside h3{font-size:12px;font-weight:600;color:var(--text);margin:24px 0 8px}
.va aside h3:first-child{margin-top:0}
.va aside .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.va aside .kv dt{color:var(--dim)} .va aside .kv dd{margin:0;color:#cbd5e1;overflow-wrap:anywhere}
.va aside a{color:var(--violet);text-decoration:none;cursor:pointer;display:block;padding:2px 0}
/* A chat */
.va .thead{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
.va .thead .ids{font:400 12px var(--mono);color:var(--dim)}
.va .msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid #161d33}
.va .msg.hl{background:#6366f112;box-shadow:-12px 0 0 #6366f112,12px 0 0 #6366f112}
.va .msg header{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.va .msg header b{font-weight:600}
.va .msg .kind,.va .msg .t,.va .msg .via{color:var(--dim);font-size:12px}
.va .msg .txt{font-size:14px;line-height:1.65;color:#dfe3ea;margin-top:6px;max-width:68ch;overflow-wrap:anywhere}
.va .msg .txt code{font:12.5px var(--mono);background:#171f37;padding:1px 5px;border-radius:4px}
.va .reply{display:inline-flex;gap:6px;font-size:12px;color:var(--violet);margin-top:4px;cursor:pointer;text-decoration:none}
.va .reply span{color:var(--dim);max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.va .trunc{display:block;font-size:12px;color:#c4b5fd;margin-top:6px}
.va .atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.va .rc{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--dim)}
.va .rc span{display:inline-flex;align-items:center;gap:5px}
.va .rc i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.va .rc i.ring{background:none;border:1.5px solid var(--c)}
.va .box{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-top:8px;background:#0e1426;font-size:13px}
.va .sys{font-size:12.5px;color:var(--dim);padding:12px 0 12px 40px;border-bottom:1px solid #161d33}
.va main.chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
.va main.chat .log{flex:1;overflow:auto;padding:40px 48px 16px}
.va main.chat .cwrap{padding:12px 48px 76px;border-top:1px solid var(--line);background:#0b0f19}
.va .composer{border:1px solid var(--line2);border-radius:10px;background:#0f1529;padding:10px}
.va .composer textarea{width:100%;background:none;border:0;color:var(--text);font:14px/1.5 var(--sans);resize:none;height:44px;outline:none}
.va .composer .bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.va .seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.va .seg button{border:0;background:none;padding:4px 9px;font:500 11.5px var(--mono);color:var(--muted)}
.va .seg button.on{background:#1e2745;color:var(--text)}
.va .composer .bar .sp{flex:1}
/* A dash */
.va table{width:100%;border-collapse:collapse;font-size:13px}
.va th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
.va td{padding:9px 10px 9px 0;border-bottom:1px solid #161d33;vertical-align:top}
.va td .sub{display:block;font:400 11px var(--mono);color:var(--dim)}
.va .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.va .bar5{display:inline-block;width:64px;height:5px;background:#1c2440;border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.va .bar5 b{display:block;height:100%;background:var(--grad)}
.va .audit{font:12px/1.75 var(--mono);color:#b6bfd0;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#0c1120}
.va .audit .t{color:var(--dim)}
.va .stat{display:flex;gap:28px;margin:6px 0 4px}
.va .stat div{font-size:12px;color:var(--dim)}
.va .stat b{display:block;font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.pdot.idle{background:#34d399}.pdot.working{background:#fbbf24}.pdot.blocked{background:#fb7185}.pdot.offline{background:#475569}.pdot.unknown{background:none;border:1.5px dashed #64748b;width:9px;height:9px}.pdot.na{background:none}
.rch{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid;flex:none}
.rch.connected{border-color:#818cf8;background:#818cf855}.rch.reachable{border-color:#818cf8}.rch.unreachable{border-color:#fb7185}.rch.unknown{border-color:#475569;border-style:dotted}

/* ===================== VARIANT B: packed heterogeneous tiles ===================== */
.vb{height:100vh;overflow:auto;padding:16px 16px 96px;background:radial-gradient(1200px 500px at 85% -10%,#6366f118,transparent 60%),var(--bg)}
.vb .top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.vb .mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.vb .mark i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:block}
.vb .tabs{display:flex;gap:6px;margin-left:16px}
.vb .tabs button{border:1px solid var(--line2);background:#10162a;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.vb .tabs button.on{background:#f3f4f6;color:#0b0f19;border-color:#f3f4f6}
.vb .tabs .n{font:600 11px var(--mono);background:#fb7185;color:#0b0f19;border-radius:6px;padding:1px 5px}
.vb .hubst{margin-left:auto;display:flex;gap:16px;font:500 12px var(--mono);color:var(--muted);align-items:center}
.vb .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:78px;grid-auto-flow:dense;gap:10px}
.vb .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0}
.vb .tile h4{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.vb .tile h4 .r{margin-left:auto;font:500 11px var(--mono);color:var(--dim)}
.vb .scroll{overflow:auto;min-height:0;flex:1}
.vb .c2{grid-column:span 2}.vb .c3{grid-column:span 3}.vb .c4{grid-column:span 4}.vb .c5{grid-column:span 5}.vb .c6{grid-column:span 6}.vb .c7{grid-column:span 7}.vb .c8{grid-column:span 8}.vb .c12{grid-column:span 12}
.vb .r1{grid-row:span 1}.vb .r2{grid-row:span 2}.vb .r3{grid-row:span 3}.vb .r4{grid-row:span 4}.vb .r5{grid-row:span 5}.vb .r6{grid-row:span 6}.vb .r8{grid-row:span 8}.vb .r9{grid-row:span 9}
.vb .t-apr{background:linear-gradient(160deg,#1b1a3d 0%,#141331 60%,#10162a 100%);border-color:#6d5ce880}
.vb .t-apr .q{font-size:19px;font-weight:600;line-height:1.35;letter-spacing:-.01em;margin:2px 0 8px;max-width:30ch}
.vb .t-apr .from{font-size:12.5px;color:#c4b5fd}
.vb .t-apr .ctx{font-size:13px;color:#b4bcd0;line-height:1.5;flex:1;overflow:hidden;max-width:52ch}
.vb .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vb .opt{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;background:#f3f4f6;color:#0b0f19}
.vb .opt.alt{background:#232b48;color:var(--text)}
.vb .ring{position:absolute;right:14px;top:14px;display:grid;place-items:center}
.vb .ring span{position:absolute;font:700 13px var(--mono)}
.vb .t-dl{background:#1a1020;border-color:#fb718555}
.vb .t-dl .code{font:700 22px var(--mono);color:var(--bad);letter-spacing:-.02em}
.vb .t-dl .d{font-size:12.5px;color:#d4c3cc;line-height:1.5;margin:4px 0 auto}
.vb .t-dl .acts{display:flex;gap:8px;margin-top:8px}
.vb .sbtn{border:1px solid var(--line2);background:#1a2139;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}
.vb .sbtn.red{border-color:#fb718566;color:#fecdd3;background:#2a1220}
.vb .t-me{background:#13240f00;border-style:dashed}
.vb .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.vb .big small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.vb .li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #1c2440;font-size:13px}
.vb .li:first-child{border-top:0}
.vb .li .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cbd5e1}
.vb .li .tm{font:500 11px var(--mono);color:var(--dim)}
.vb .li.done{opacity:.45}
.vb .chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;background:#1a2139}
.vb .kdot{width:10px;height:10px;border-radius:3px;background:var(--k);flex:none}
.vb .held{display:flex;gap:10px;overflow-x:auto;flex:1;padding-bottom:4px}
.vb .hc{flex:0 0 230px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#0d1325;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.vb .hc .x{color:#cbd5e1;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vb .hc .f{display:flex;gap:6px;align-items:center;margin-top:auto}
.vb .hc .att{white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.vb .hc.done{opacity:.45}
/* B chat */
.vb .tr{display:flex;flex-direction:column;gap:10px}
.vb .bm{border:1px solid var(--line2);border-left:4px solid var(--k);border-radius:10px;padding:10px 12px;background:#0d1325}
.vb .bm.mine{background:#17153a;border-color:#6d5ce866;border-left-color:#a855f7;margin-left:60px}
.vb .bm.hl{box-shadow:0 0 0 2px #a855f7}
.vb .bm header{display:flex;gap:8px;align-items:center;font-size:12.5px}
.vb .bm header b{font-weight:700}
.vb .bm .m{color:var(--dim);font:500 11px var(--mono)}
.vb .bm .txt{font-size:13.5px;line-height:1.55;margin-top:6px;color:#dfe3ea;overflow-wrap:anywhere}
.vb .bm .txt code{font:12px var(--mono);background:#1a2240;padding:1px 4px;border-radius:4px}
.vb .bm .rl{font-size:11.5px;color:var(--violet);cursor:pointer;margin-top:4px;display:block}
.vb .bm .atts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vb .bm .rcs{display:flex;gap:3px;justify-content:flex-end;margin-top:6px}
.vb .bm .rcs i{width:14px;height:4px;border-radius:2px;background:var(--c)}
.vb .bm .trunc{font-size:11.5px;color:#c4b5fd;margin-top:4px}
.vb .bm .inner{margin-top:8px;border-radius:8px;padding:8px 10px;background:#ffffff08;font-size:12.5px}
.vb .bsys{text-align:center;font-size:11.5px;color:var(--dim)}
.vb .comp{display:flex;gap:8px;margin-top:10px;align-items:center}
.vb .comp input{flex:1;background:#0b1022;border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:10px 12px;font:13.5px var(--sans);outline:none}
.vb .comp input:focus{border-color:#6366f1}
.vb .pbtn{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font:600 11px var(--mono);background:#121a31}
.vb .matrix{display:grid;gap:3px;font:500 10.5px var(--mono);color:var(--dim)}
.vb .matrix .c{height:18px;border-radius:3px;background:var(--c,#151c33)}
.vb .matrix .c.s{background:repeating-linear-gradient(135deg,#2a3352 0 3px,#151c33 3px 6px)}
.vb .matrix .h{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.vb .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:auto;padding-top:8px}
.vb .legend span{display:inline-flex;align-items:center;gap:4px}
.vb .legend i{width:10px;height:6px;border-radius:2px;background:var(--c)}
.vb .gauge{height:10px;border-radius:5px;background:#1c2440;overflow:hidden;margin:6px 0 10px}
.vb .gauge b{display:block;height:100%;background:var(--grad)}
.vb .part{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 0}
/* B dash */
.vb .peer{border-top:3px solid var(--k)}
.vb .peer .nm{font-size:15px;font-weight:700;letter-spacing:-.01em}
.vb .peer .kd{font:500 11px var(--mono);color:var(--dim)}
.vb .peer .caps{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.vb .peer .caps span{font:500 10.5px var(--mono);color:#aab3c5;background:#1a2139;border-radius:5px;padding:2px 6px}
.vb .peer .two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;font-size:11.5px;color:var(--muted)}
.vb .peer .two div{display:flex;align-items:center;gap:6px}
.vb .qb{height:6px;border-radius:3px;background:#1c2440;overflow:hidden;margin-top:8px}

 {at:T('00:31:40'),th:'T5',peer:'triage',reason:'max_depth_exceeded'},

/* ============================== helpers ============================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = ms => new Date(ms).toISOString().slice(11,16);
const hms = ms => new Date(ms).toISOString().slice(11,19);
const iso = ms => new Date(ms).toISOString();
const sid = id => id ? id.slice(0, id.indexOf('_') + 1) + '…' + id.slice(-4) : '';

const bytesOf = s => new TextEncoder().encode(s).length;
function rel(ms){ const d = ms - now(), a = Math.abs(d), m = Math.round(a/60000);
  const t = a < 60000 ? Math.round(a/1000) + 's' : m < 90 ? m + 'm' : Math.round(m/60) + 'h';
  return d >= 0 ? 'in ' + t : t + ' ago'; }
function cd(ms){ const d = Math.max(0, ms - now()), m = Math.floor(d/60000), s = Math.floor(d%60000/1000); return m + ':' + String(s).padStart(2,'0'); }
const md = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const tname = to => to.map(r => PEER[r] ? PEER[r].name : GROUPS[r] ? GROUPS[r].name : sid(r)).join(', ');
const presOf = k => { const p = PEER[k]; if (p.pres.s === 'na') return 'na';
  const ttl = p.kind === 'session' ? 15*60000 : 3600000; return (!p.pres.at || now() - p.pres.at > ttl) ? 'unknown' : p.pres.s; };
const msgsOf = th => MSGS.filter(m => m.th === th);
const msgById = id => MSGS.find(m => m.id === id);
const threadOrder = () => Object.values(THREADS).sort((a,b) => lastAt(b.k) - lastAt(a.k));

const clip = svgClip();
function svgClip(){ return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7L14 4.5a3.3 3.3 0 014.7 4.7L10.2 17.7a1.7 1.7 0 01-2.4-2.4L15.5 7.6"/></svg>'; }
const attChip = a => `<a class="att${a.spill?' spill':''}" href="#" onclick="return false" title="${esc(a.mt)}${a.spill?' (hub auto-spilled the full text)':''}">${clip}${esc(a.name)} <span class="sz">${kib(a.size)}</span></a>`;
const prioChip = p => `<span class="prio ${p}">${p}</span>`;
let idn = 0;
const fakeId = pfx => pfx + '_01JD3Z' + String(++idn).padStart(4,'0') + 'PRT0TYPE0NLY'.replace(/[OIL]/g,'0').slice(0,16);
const ST_LABEL = {queued:'queued',pushed:'pushed',accepted:'accepted',processed:'processed',read:'read',failed:'failed',dead_letter:'dead letter',expired:'expired'};

function inboxItems(){
  return MSGS.filter(m => m.rc && m.rc.max && m.from !== 'max').map(m => {
    const r = m.rc.max, held = m.prio === 'hold' || m.prio === 'wake_idle';
    return {m, r, held, done: ['processed','read'].includes(r.s), apr: m.apr ? APR[m.apr.id] : null};
  }).sort((a,b) => b.m.at - a.m.at);
}
const openApprovals = () => inboxItems().filter(i => i.apr && i.apr.status === 'open');
const deadNow = () => DL.filter(d => d.state === 'dead');
function cutsByReason(){ const o = {max_depth_exceeded:0,thread_budget_exhausted:0,expired:0}; CUTS.forEach(c => o[c.reason]++); return o; }

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
function audit(actor, act, tgt){ AUD.unshift({at:now(), actor, act, tgt}); }

function answer(aid, opt){
  const a = APR[aid]; const m = MSGS.find(x => x.apr && x.apr.id === aid);
  if (a.status !== 'open'){ toast('409: approval already ' + a.status); return; }
  Object.assign(a, {status:'answered', decision:opt, at:now()});
  m.rc.max = {s:'processed', at:now()};
  const r = {id:fakeId('msg'), th:m.th, from:'max', to:[m.from], prio:'wake', at:now(), kind:'approval_response', depth:m.depth+1, reply:m.id, text:'Decision: **' + opt + '**', resp:{id:aid, decision:opt}, rc:{[m.from]:{s:'queued', at:now()}}};
  MSGS.push(r); progress(r); THREADS[m.th].budget--;
  audit('max', 'approval.respond', sid(aid) + ' "' + opt + '"');
  toast('Answered "' + opt + '" to ' + PEER[m.from].name); render();
}
function expireCheck(){
  let changed = false;
  MSGS.filter(m => m.apr && APR[m.apr.id].status === 'open' && m.apr.exp <= now()).forEach(m => {
    Object.assign(APR[m.apr.id], {status:'expired', decision:'expired', at:m.apr.exp});
    m.rc.max = {s:'expired', at:m.apr.exp};
    MSGS.push({id:fakeId('sys'), th:m.th, kind:'system', at:m.apr.exp, text:'hub posted approval_response "expired" for ' + sid(m.apr.id) + ' (' + PEER[m.from].name + ' asked: ' + m.apr.q + ')'});
    audit('hub', 'approval.expired', sid(m.apr.id)); toast('Approval from ' + PEER[m.from].name + ' expired'); changed = true;
  });
  if (changed) render();
}
function progress(m){
  Object.keys(m.rc).forEach(k => {
    const p = PEER[k]; const heldIdle = m.prio === 'wake_idle' && presOf(k) !== 'idle' && presOf(k) !== 'unknown';
    if (m.prio === 'hold' || heldIdle){ m.rc[k] = {s:'queued', at:now(), note:'held in log until next pull'}; return; }
    const step = (s, ms, note) => setTimeout(() => { m.rc[k] = {s, at:now(), note}; render(); }, ms);
    if (p.reach.s === 'unreachable'){ step('pushed', 500); step('dead_letter', 2600, 'prototype: unreachable route');
      setTimeout(() => { DL.unshift({id:fakeId('dly'), to:k, msg:m.id, th:m.th, from:m.from, attempts:'8/8', code:'503', why:'Prototype: unreachable peer, retries exhausted instantly', cls:'retries exhausted', at:now(), state:'dead'}); render(); }, 2650); return; }
    step('pushed', 450); step('accepted', 1200); step('processed', 3000, p.kind === 'grokbot' ? 'run started' : null);
  });
}
function retryDL(id){
  const d = DL.find(x => x.id === id); d.state = 'retrying'; audit('max', 'delivery.retry', sid(id) + ' → ' + PEER[d.to].name);
  const m = msgById(d.msg); toast('Retrying ' + sid(id) + ' to ' + PEER[d.to].name); render();
  setTimeout(() => { if (m) m.rc[d.to] = {s:'pushed', at:now()}; render(); }, 700);
  setTimeout(() => {
    if (d.to === 'triage' && d.code === '410'){ d.state = 'dead'; d.attempts = '1/8'; d.why = 'Still 410 Gone after retry. Re-enrol the route or discard.'; d.at = now(); if (m) m.rc[d.to] = {s:'dead_letter', at:now()}; toast('Retry failed: 410 Gone again'); }
    else { d.state = 'recovered'; if (m) m.rc[d.to] = {s:'accepted', at:now()}; toast('Delivered: ' + PEER[d.to].name + ' accepted'); }
    render(); }, 1900);
}
function discardDL(id){ const d = DL.find(x => x.id === id); d.state = 'discarded'; audit('max','delivery.discard',sid(id)); toast('Discarded ' + sid(id)); render(); }
function markDone(mid){ const m = msgById(mid); m.rc.max = {s:'processed', at:now()}; toast('Marked processed'); render(); }
function send(text){
  text = (text || '').trim(); if (!text) return false;
  const th = THREADS[S.thread];
  if (th.state === 'cut'){ toast('422: this thread was cut by loop control. Raise its budget first (operator only).'); return false; }
  const to = th.parts.filter(k => k !== 'max' && PEER[k].kind !== 'source');
  let truncated = false, atts = [], b = bytesOf(text);
  if (b > 4096){ truncated = true; atts.push({name:'message.md', size:b, mt:'text/markdown', spill:true}); text = text.slice(0, 1200) + ' …'; }
  const m = {id:fakeId('msg'), th:S.thread, from:'max', to, prio:S.prio, at:now(), kind:'message', depth:0, text, truncated, atts, rc:Object.fromEntries(to.map(k => [k, {s:'queued', at:now()}]))};
  MSGS.push(m); th.budget--; progress(m); S.scrollBottom = true; render(); return true;
}

  const line = (e, n) => { const sel = n === S.sel ? 'sel' : '';
    if (e.t === 'DLQ') return `<div class="ln ${sel}" data-act="csel" data-v="${n}"><span class="r b">DLQ </span> ${hm(e.d.at)}  ${pad(PEER[e.d.to].name,16)} <span class="r">${e.d.code}</span> ${pad(e.d.cls,18)} ${e.d.state==='retrying'?'<span class="c">retrying…</span>':'<span class="d">'+e.d.attempts+'</span>'}</div>`;
    const i = e.i, tag = e.t === 'APR' ? '<span class="m b">APR </span>' : e.t === 'WAKE' ? '<span class="y b">WAKE</span>' : '<span class="d b">HOLD</span>';
    const tail = e.t === 'APR' ? (i.apr.status === 'open' ? `<span class="y">exp <span data-cd="${i.m.apr.exp}">${cd(i.m.apr.exp)}</span></span>` : `<span class="d">${i.apr.status}</span>`) : `<span class="${RC_CLS[i.r.s]}">${RC_GLYPH[i.r.s]}</span>`;
    return `<div class="ln ${sel} ${i.done&&e.t!=='APR'?'done':''}" data-act="csel" data-v="${n}">${tag}  ${hm(i.m.at)}  ${pad(PEER[i.m.from].name,16)} ${pad(e.t==='APR'?i.m.apr.q:i.m.text,46)} ${tail}</div>`; };
  let det = '';
  if (cur && cur.t === 'DLQ'){ const d = cur.d;
    det = `<div class="wrap"><span class="r b">dead letter</span>  ${d.id}\n\n<span class="d">to       </span>${esc(PEER[d.to].name)} <span class="d">(${PEER[d.to].kind}, reach ${PEER[d.to].reach.s})</span>\n<span class="d">from     </span>${esc(PEER[d.from].name)}\n<span class="d">thread   </span>${esc(THREADS[d.th].title)}\n<span class="d">code     </span><span class="r">${d.code}</span> ${esc(d.cls)}\n<span class="d">attempts </span>${d.attempts}\n<span class="d">at       </span>${iso(d.at)}\n\n${esc(d.why)}\n\n<span class="m">[r]</span> retry   <span class="m">[x]</span> discard   <span class="m">[enter]</span> open thread</div>`; }
  else if (cur){ const i = cur.i, m = i.m;
    det = `<div class="wrap"><span class="b ${cur.t==='APR'?'m':cur.t==='WAKE'?'y':'d'}">${m.kind}</span>  <span class="${PR_CLS[m.prio]}">${m.prio}</span>${i.held?' <span class="d">(held: you were working)</span>':''}\n\n<span class="d">from     </span>${esc(PEER[m.from].name)} <span class="d">${PEER[m.from].kind}</span>\n<span class="d">thread   </span>${esc(THREADS[m.th].title)}\n<span class="d">message  </span>${m.id}\n<span class="d">depth    </span>${m.depth}/${THREADS[m.th].max_depth}${m.via?`\n<span class="d">via      </span>${esc(GROUPS[m.via].name)}`:''}\n<span class="d">receipt  </span><span class="${RC_CLS[i.r.s]}">${RC_GLYPH[i.r.s]} ${i.r.s}</span>\n\n<span class="w">${esc(m.text)}</span>${m.truncated?'\n<span class="m">[+ spilled to message.md]</span>':''}${(m.atts||[]).map(a=>`\n<span class="c">⎘ ${esc(a.name)}</span> <span class="d">${kib(a.size)} ${a.mt}</span>`).join('')}`;
    if (cur.t === 'APR'){ const a = i.apr;
      det += a.status === 'open' ? `\n\n<span class="m b">? ${esc(m.apr.q)}</span>\n${m.apr.options.map((o,n)=>`  <span class="${S.ansMode?'y b':'m'}">[${n+1}]</span> ${esc(o)}`).join('\n')}\n\n<span class="d">expires ${hm(m.apr.exp)}Z, in </span><span class="y" data-cd="${m.apr.exp}">${cd(m.apr.exp)}</span>\n${S.ansMode?'<span class="y">press 1..'+m.apr.options.length+' to answer, esc to cancel</span>':'<span class="d">press a to answer</span>'}`
        : `\n\n<span class="${a.status==='expired'?'d':'g'}">${a.status==='expired'?'expired':'answered "'+esc(a.decision)+'"'} at ${hm(a.at)}</span>`; }
    det += '</div>'; }
  return `<div class="body" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)">
   <div class="pane f"><span class="pt">inbox <span class="k">${L.length} items · apr ${openApprovals().length} · dlq ${deadNow().length}</span></span><div class="pb" data-keep="c-list">${L.map(line).join('')}</div></div>
   <div class="pane" style="grid-column:1;grid-row:2"><span class="pt">your event log <span class="k">GET /v1/events -f · not messages, never replied to</span></span><div class="pb" data-keep="c-ev" data-bottom="1">${opEvents().map(e => `<div class="ln"><span class="d">${e.cur}</span> <span class="d">${hms(e.at)}</span> <span class="${e.type==='receipt'?'g':e.type==='presence'?'y':'m'}">${pad(e.type,15)}</span>${e.txt}</div>`).join('')}</div></div>
   <div class="pane" style="grid-column:2;grid-row:1 / span 2"><span class="pt">detail</span><div class="pb">${det||'<span class="d">nothing selected</span>'}</div></div></div>`;
}
function opEvents(){
  const ev = [
    {at:T('06:15:00'),type:'presence',txt:'pag-hark-sleuth <span class="y">working</span> <span class="d">lan:x-tuf quota 61%</span>'},
    {at:T('06:20:30'),type:'thread_updated',txt:'thr_…P5R title "hark B196: radio end-phrase bug" <span class="d">budget 496</span>'},
    {at:T('06:31:00'),type:'group_updated',txt:'grp_…7T b196-repro created by pag-hark-sleuth <span class="d">4 members</span>'},
    {at:T('07:30:00'),type:'presence',txt:'pag-hark-sleuth <span class="y">working</span> <span class="d">quota 61%</span>'},
    {at:T('07:33:10'),type:'presence',txt:'codex-hark <span class="y">working</span> <span class="d">lan:xsm</span>'},
  ];
  MSGS.filter(m => m.from === 'max' && m.rc).forEach(m => Object.entries(m.rc).forEach(([k,r]) => {
    if (r.s !== 'queued') ev.push({at:r.at, type:'receipt', txt:`${sid(m.id)} → ${esc(PEER[k].name)} <span class="${RC_CLS[r.s]}">${RC_GLYPH[r.s]} ${r.s}</span>${r.note?' <span class="d">'+esc(r.note)+'</span>':''}`}); }));
  MSGS.filter(m => m.kind === 'system' && m.text.startsWith('hub posted')).forEach(m => ev.push({at:m.at, type:'approval_expired', txt:esc(m.text.replace('hub posted ',''))}));
  return ev.sort((a,b) => a.at - b.at).map((e,n) => Object.assign(e, {cur:'e1.' + (10401 + n)}));
}
function Cchat(L){
  const th = THREADS[S.thread], ms = msgsOf(S.thread), cur = L[S.sel];
  const tlist = Object.values(THREADS).map((t,n) => `<div class="ln ${t.k===S.thread?'sel':''}" data-act="thread" data-v="${t.k}"><span class="d">${n+1}</span> ${pad(t.title,26)}${t.state==='cut'?' <span class="r">cut</span>':''}</div>`).join('');
  const log = ms.map(m => { if (m.kind === 'system') return `<div class="msgline d">-- ${hm(m.at)} ${esc(m.text)}</div>`;
    const p = PEER[m.from], sel = cur && cur.id === m.id ? 'sel' : '';
    const rcs = Object.entries(m.rc||{}).map(([k,r]) => `<span class="${RC_CLS[r.s]}">${esc(PEER[k].name.split('-')[0])}${RC_GLYPH[r.s]}</span>`).join(' ');
    let x = '';
    const re = m.reply && msgById(m.reply) ? `<span class="d">↳${esc(PEER[msgById(m.reply).from].name.split('-')[0])}@${hm(msgById(m.reply).at)}</span> ` : '';
    x += `<span class="d">${hm(m.at)}</span> <span class="${PR_CLS[m.prio]}">${m.prio==='wake'?'!':m.prio==='wake_idle'?'~':' '}</span><span style="color:${KC[p.kind]}" class="b">&lt;${esc(p.name)}&gt;</span> ${re}${md(m.text)}`;
    if (m.truncated) x += ` <span class="m">[+${kib(m.atts[0].size)} spilled → message.md]</span>`;
    (m.atts||[]).filter(a => !a.spill).forEach(a => x += `\n       <span class="c">⎘ ${esc(a.name)}</span> <span class="d">${kib(a.size)}</span>`);
    if (m.kind === 'approval_request'){ const a = APR[m.apr.id]; x += `\n       <span class="m b">? ${esc(m.apr.q)}</span> ${a.status==='open'?m.apr.options.map((o,n)=>`<span class="m">[${n+1}]${esc(o)}</span>`).join(' ')+` <span class="y">exp <span data-cd="${m.apr.exp}">${cd(m.apr.exp)}</span></span>`:`<span class="d">${a.status}</span>`}`; }
    if (m.kind === 'job_status') x += `\n       <span class="g">job ${sid(m.job.id)} ${m.job.state} seq ${m.job.seq}</span> <span class="d">${esc(m.job.output)}</span>`;
    x += `\n       <span class="rc">${rcs}</span>`;
    return `<div class="msgline ${sel} ${S.hl===m.id?'sel':''}" id="m-${m.id}">${x}</div>`; }).join('');
  return `<div class="body" style="grid-template-columns:250px minmax(0,1fr) 230px">
   <div class="pane"><span class="pt">threads <span class="k">[ ]</span></span><div class="pb">${tlist}</div></div>
   <div class="pane f"><span class="pt">${esc(th.title)} <span class="k">${sid(th.id)} · budget ${th.budget}</span></span><div class="pb" data-keep="c-log" data-bottom="1">${log}</div></div>
   <div class="pane"><span class="pt">who</span><div class="pb">${th.parts.map(k => `<div class="ln"><span style="color:${KC[PEER[k].kind]}">■</span> ${pad(PEER[k].name,15)} <span class="${presOf(k)==='idle'?'g':presOf(k)==='working'?'y':'d'}">${presOf(k)==='na'?'n/a':presOf(k).slice(0,4)}</span></div>`).join('')}
   <div class="ln d" style="margin-top:10px">${th.group?esc(GROUPS[th.group].kind)+':':''}</div>${th.group?`<div class="ln">${esc(GROUPS[th.group].name)}</div>`:''}
   ${th.origin?`<div class="ln d" style="margin-top:10px">origin:</div><div class="ln c">${esc(th.origin.system)} ${esc(th.origin.thread_id)}</div>`:''}
   <div class="ln d" style="margin-top:10px">receipts:</div><div class="wrap d">· queued  › pushed\n<span class="m">✓ accepted</span>\n<span class="g">✓✓ processed</span>\n<span class="w">◉ read</span>  <span class="r">✗ dead</span></div>
   <div class="ln d" style="margin-top:10px">priority:</div><div class="wrap"><span class="y">! wake</span>  <span class="c">~ wake_idle</span>\n<span class="d">  hold</span></div></div></div></div>`;
}
function Cdash(){
  const c = cutsByReason();
  const bar = (pct, w) => pct == null ? pad('', w + 2) : '[' + '|'.repeat(Math.round(pct/100*w)).padEnd(w, ' ') + ']';
  const cols = '18ch 11ch 9ch 12ch 18ch 14ch minmax(0,1fr)';
  return `<div class="body" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">
   <div class="pane f" style="grid-column:1 / -1"><span class="pt">peers <span class="k">${PEERS.length} · presence is self-reported, reach is hub-observed</span></span><div class="pb tbl" style="--cols:${cols}">
    <div class="ln hd" style="--cols:${cols}"><span>PEER</span><span>KIND</span><span>PRESENCE</span><span>REACH</span><span>QUOTA (WEEK)</span><span>LOCATION</span><span>LAST SEEN / CAPS</span></div>
    ${PEERS.map((p,n) => { const pr = presOf(p.k), q = p.quota && p.quota.weekly_remaining_pct;
      return `<div class="ln ${n===S.sel?'sel':''}" style="--cols:${cols}" data-act="csel" data-v="${n}"><span style="color:${KC[p.kind]}">${esc(p.name)}</span><span class="d">${p.kind}</span><span class="${pr==='idle'?'g':pr==='working'?'y':pr==='blocked'?'r':'d'}">${pr==='na'?'-':pr}</span><span class="${p.reach.s==='unreachable'?'r':p.reach.s==='connected'?'m':'c'}">${p.reach.s}</span><span class="${q!=null&&q<10?'r':'g'}">${q!=null?bar(q,10)+' '+String(q).padStart(3)+'%':'-'}</span><span class="d">${esc(p.loc)}</span><span class="d">${rel(p.reach.at)} ${esc(p.caps.join(','))}</span></div>`; }).join('')}</div></div>
   <div class="pane"><span class="pt">threads</span><div class="pb">${threadOrder().map(t => `<div class="ln" data-act="thread" data-v="${t.k}">${pad(t.title,30)} <span class="d">${String(msgsOf(t.k).filter(m=>m.kind!=='system').length).padStart(2)}m</span> <span class="${t.state==='cut'?'r':'g'}">${t.state==='cut'?'cut ':''}${t.budget}</span></div>`).join('')}</div></div>
   <div class="pane"><span class="pt">dead letters <span class="k">${deadNow().length} open</span></span><div class="pb">${DL.map(d => `<div class="ln"><span class="r">${d.code}</span> ${pad(PEER[d.to].name,13)} ${pad(d.cls,18)} <span class="${d.state==='dead'?'r':'d'}">${d.state}</span></div>`).join('')}
    <div class="ln d" style="margin-top:12px">loop cuts / 24h: <span class="m b">${CUTS.length}</span></div><div class="ln d">  max_depth_exceeded     <span class="w">${c.max_depth_exceeded}</span></div><div class="ln d">  thread_budget_exhausted <span class="w">${c.thread_budget_exhausted}</span></div><div class="ln d">  expired                <span class="w">${c.expired}</span></div></div></div>
   <div class="pane"><span class="pt">audit tail <span class="k">-f</span></span><div class="pb">${AUD.slice(0,16).map(a => `<div class="ln"><span class="d">${hms(a.at)}</span> <span class="m">${pad(a.act,19)}</span> ${esc(a.actor)} <span class="d">${esc(a.tgt)}</span></div>`).join('')}</div></div></div>`;
}
function cAct(key){
  const L = cList(), cur = L[S.sel];
  if (S.tab === 'inbox' && cur){
    if (S.ansMode && cur.t === 'APR' && /^[1-9]$/.test(key)){ const o = cur.i.m.apr.options[+key - 1]; if (o){ S.ansMode = false; answer(cur.i.m.apr.id, o); } return true; }
    if (key === 'a' && cur.t === 'APR' && cur.i.apr.status === 'open'){ S.ansMode = true; render(); return true; }
    if (key === 'r' && cur.t === 'DLQ'){ retryDL(cur.d.id); return true; }
    if (key === 'x' && cur.t === 'DLQ'){ discardDL(cur.d.id); return true; }
    if (key === 'p' && cur.i){ markDone(cur.i.m.id); return true; }
    if (key === 'Enter'){ go('chat', cur.i ? cur.i.m.th : cur.d.th); return true; }
  }
  if (S.tab === 'chat'){
    const keys = Object.keys(THREADS), ix = keys.indexOf(S.thread);
    if (key === '[' || key === ']'){ go(null, keys[(ix + (key === ']' ? 1 : keys.length - 1)) % keys.length]); return true; }
    if (key === 'g' && cur && cur.reply){ jump(cur.reply); return true; }
    if (key === 'w'){ cyclePrio(); return true; }
    if (key === 'i'){ document.getElementById('cmd').focus(); return true; }
  }
  if (S.tab === 'dash' && key === 'Enter' && cur){ const t = threadOrder().find(t => t.parts.includes(cur.k)); if (t) go('chat', t.k); return true; }
  return false;
}
function runCmd(raw){
  const v = raw.trim(); if (!v) return;
  if (S.tab === 'chat' && !v.startsWith(':')){ send(v); S.cmdNote = 'sent with priority ' + S.prio; return; }
  const [c, ...rest] = v.replace(/^:/, '').split(/\s+/), arg = rest.join(' ');
  if (c === 'help'){ S.help = true; }
  else if (c === 'retry' && arg === 'all'){ deadNow().forEach(d => retryDL(d.id)); S.cmdNote = 'retrying all dead letters'; }
  else if (c === 'ff'){ skew += (+arg || 15) * 60000; S.cmdNote = 'clock +' + (+arg || 15) + ' min'; expireCheck(); }
  else if (c === 'thread'){ const t = Object.keys(THREADS)[+arg - 1]; if (t) go('chat', t); }
  else if (c === 'prio' && ['wake','wake_idle','hold'].includes(arg)){ S.prio = arg; }
  else if (c === 'presence' && ['idle','working','blocked'].includes(arg)){ PEER.max.pres = {s:arg, at:now()}; S.cmdNote = 'presence ' + arg; }
  else if (c === 'send'){ send(arg); }
  else S.cmdNote = 'unknown command: ' + c + ' (try :help)';
  render();
}
function cyclePrio(){ const p = ['wake','wake_idle','hold']; S.prio = p[(p.indexOf(S.prio) + 1) % 3]; render(); }

/* ============================== render loop ============================== */
const VIEW = {a:A, b:B, c:C};
function render(){
  const ae = document.activeElement, fid = ae && ae.id, val = {}, sel = {};
  ['compose','cmd'].forEach(id => { const e = document.getElementById(id); if (e){ val[id] = e.value; sel[id] = [e.selectionStart, e.selectionEnd]; } });
  const scr = {}; document.querySelectorAll('[data-keep]').forEach(e => scr[e.dataset.keep] = e.scrollTop);
  document.getElementById('app').innerHTML = VIEW[S.variant]();
  document.querySelectorAll('[data-keep]').forEach(e => {
    if (S.scrollBottom && e.dataset.bottom) e.scrollTop = e.scrollHeight;
    else if (scr[e.dataset.keep] != null) e.scrollTop = scr[e.dataset.keep]; });
  S.scrollBottom = false;
  Object.keys(val).forEach(id => { const e = document.getElementById(id); if (e){ e.value = val[id]; if (fid === id){ e.focus(); try { e.setSelectionRange(...sel[id]); } catch(_){} } } });
  updBytes();
  document.getElementById('plbl').textContent = VARIANTS[S.variant];
  document.getElementById('pclk').textContent = hm(now()) + 'Z';
}
function updBytes(){ const e = document.getElementById('compose'), b = document.getElementById('bytes'); if (e && b){ const n = bytesOf(e.value); b.textContent = n + ' / 4096 B' + (n > 4096 ? ', will auto-spill' : ''); b.style.color = n > 4096 ? '#c4b5fd' : ''; } }
function cycleVariant(d){ const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + d + k.length) % k.length]; S.sel = 0; S.ansMode = false; S.help = false; S.scrollBottom = true; syncURL(); render(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v; if (t.tagName === 'A') e.preventDefault();
  if (a === 'tab') go(v);
  else if (a === 'thread' || a === 'open') go('chat', v);
  else if (a === 'answer') answer(v, t.dataset.o);
  else if (a === 'retry') retryDL(v);
  else if (a === 'discard') discardDL(v);
  else if (a === 'done') markDone(v);
  else if (a === 'jump') jump(v);
  else if (a === 'prio'){ S.prio = v; render(); }
  else if (a === 'cycleprio') cyclePrio();
  else if (a === 'send'){ const c = document.getElementById('compose'); if (send(c.value)) document.getElementById('compose').value = ''; updBytes(); }
  else if (a === 'anchor'){ const el = document.getElementById(v); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
  else if (a === 'presence'){ PEER.max.pres = {s:v, at:now()}; toast('Presence set to ' + v + (v==='idle'?': wake_idle messages will now push':'')); render(); }
  else if (a === 'csel'){ S.sel = +v; S.ansMode = false; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'compose') updBytes(); });
document.addEventListener('keydown', e => {
  const typing = e.target.matches && e.target.matches('input,textarea,[contenteditable]');
  if (e.target.id === 'compose' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (send(e.target.value)) document.getElementById('compose').value = ''; updBytes(); return; }
  if (e.target.id === 'cmd'){ if (e.key === 'Enter'){ const v = e.target.value; e.target.value = ''; runCmd(v); document.getElementById('cmd').focus(); } else if (e.key === 'Escape') e.target.blur(); return; }
  if (typing) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); cycleVariant(e.key === 'ArrowLeft' ? -1 : 1); return; }
  if (S.variant !== 'c' || e.ctrlKey || e.metaKey || e.altKey) return;
  S.cmdNote = '';
  if (e.key === '?'){ S.help = !S.help; render(); return; }
  if (e.key === 'Escape'){ S.help = false; S.ansMode = false; render(); return; }
  if (S.ansMode && cAct(e.key)){ e.preventDefault(); return; }
  if (['1','2','3'].includes(e.key)){ go(['inbox','chat','dash'][+e.key - 1]); return; }
  if (e.key === 'j' || e.key === 'k'){ const n = cList().length; S.sel = Math.max(0, Math.min(n - 1, S.sel + (e.key === 'j' ? 1 : -1))); render();
    const s = document.querySelector('.vc .sel'); if (s) s.scrollIntoView({block:'nearest'}); return; }
  if (e.key === ':'){ e.preventDefault(); const c = document.getElementById('cmd'); c.value = ':'; c.focus(); return; }
  if (cAct(e.key)) e.preventDefault();
});
document.getElementById('pv').onclick = () => cycleVariant(-1);
document.getElementById('pn').onclick = () => cycleVariant(1);
document.getElementById('pff').onclick = () => { skew += 15*60000; toast('Mock clock advanced 15 minutes'); expireCheck(); render(); };
setInterval(() => {
  document.querySelectorAll('[data-cd]').forEach(e => e.textContent = cd(+e.dataset.cd));
  const k = document.getElementById('cclk'); if (k) k.textContent = hms(now()) + 'Z';
  document.getElementById('pclk').textContent = hm(now()) + 'Z';
  expireCheck();
}, 1000);
syncURL(); render();
document.fonts.ready.then(() => { S.scrollBottom = true; render(); });
</script>
</body>
